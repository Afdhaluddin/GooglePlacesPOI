spring:
  application:
    name: favourite-places

  # ---------------------------------------------------------------------------
  # MSSQL (primary database) - TESTDB. Override via env vars:
  #   DB_URL, DB_USERNAME, DB_PASSWORD
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TESTDB;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}  # no default — set DB_PASSWORD env var (see README)
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      max-lifetime: 1800000
      idle-timeout: 600000
      pool-name: FavouritePlacesHikariPool

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only validates it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/sqlserver

  cache:
    cache-names: countryInfo
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

security:
  jwt:
    # Override in production: export JWT_SECRET=<strong-random-secret>
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0123456789abcdef}
    # 24 hours
    expiration-ms: 86400000

countries-api:
  base-url: https://api.first.org
  timeout-ms: 5000

resilience4j:
  retry:
    instances:
      countriesApi:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      countriesApi:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      countriesApi:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 0s

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  # 8080 is occupied by Docker Desktop on some machines; 8081 is the default.
  port: ${SERVER_PORT:8081}

logging:
  file:
    name: logs/application.log
  level:
    root: INFO
    API_LOG: INFO
    com.cards.places: DEBUG
