services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-<your-sa-password>}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # TESTDB is expected to exist (or create it once: see README). The app
      # owns the schema via Flyway; no init scripts are run here.
      DB_URL: jdbc:sqlserver://db:1433;databaseName=TESTDB;encrypt=false;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD:-<your-sa-password>}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-production-0123456789abcdef}
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs

volumes:
  mssql-data:
